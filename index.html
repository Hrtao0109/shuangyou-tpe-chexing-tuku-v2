<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>双优产品笔记 · 全部车型</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1f2330; --muted:#7a8194; --border:#e6e8ee;
  --accent:#1d6cf2; --accent-soft:#e7f0ff;
  --shadow:0 2px 12px rgba(15,30,80,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.header-left{flex:1;min-width:200px}
h1{margin:0 0 6px;font-size:20px}
.subtitle{color:var(--muted);font-size:13px}
.lang-switch{display:flex;background:#eef0f4;border-radius:999px;padding:3px;flex-shrink:0}
.lang-btn{border:none;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600;transition:.15s}
.lang-btn.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(15,30,80,.15)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.toolbar input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:12px;align-items:center}
.tagbar .label{color:var(--muted);margin-right:4px}
.tag{padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;font-size:12px;color:var(--text);transition:.15s;white-space:nowrap;flex-shrink:0}
#brandTags{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.divider{height:1px;background:var(--border);margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.imgbox{position:relative;background:#f0f1f3;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.imgbox img{width:100%;height:100%;object-fit:contain;padding:12px}
.imgbox .badge{position:absolute;top:8px;padding:3px 8px;color:#fff;font-size:11px;border-radius:6px}
.imgbox .badge.craft{left:8px;background:rgba(0,0,0,.7)}
.imgbox .badge.brand{right:8px;background:rgba(29,108,242,.85)}
.body{padding:12px 12px 14px}
.title{font-size:14px;font-weight:600;line-height:1.4;min-height:38px}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 10px}
.meta .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef0f4;color:#475064}
.meta .pill.craft{background:#fef3e7;color:#a55b00}
.meta .pill.type{background:#e7f0ff;color:#1d4ea6}
.meta .pill.extra{background:#fef3e7;color:#a55b00}
.meta .pill.price{background:#eaf7ee;color:#1a7a3c;font-weight:600}
.meta .pill.common{background:#fdeaf3;color:#a31d5c}
.card-note{font-size:11px;color:#8a6d1f;background:#fffaeb;border:1px solid #f3e2b0;
  border-radius:8px;padding:5px 8px;margin:0 0 8px;line-height:1.45}
.actions{display:flex;gap:6px}
.btn{flex:1;font-size:12px;padding:8px 0;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;text-align:center;transition:.15s}
.btn:hover{background:#f3f5f9}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1854c2}
.counts{color:var(--muted);font-size:12px}
.empty{padding:60px;text-align:center;color:var(--muted);background:#fff;border-radius:14px;border:1px dashed var(--border)}
.lightbox{position:fixed;inset:0;background:rgba(15,20,40,.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:30px}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:70vh;object-fit:contain;border-radius:8px}
.lightbox .lb-title{color:#fff;text-align:center;margin-top:14px;font-size:14px;max-width:90vw}
.lightbox .lb-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.lb-btn{padding:10px 18px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:13px}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:20px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.tip-bar{background:linear-gradient(90deg,#fff8e1,#fff3e0);border:1px solid #f5d491;color:#7a4f00;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tip-bar .close{cursor:pointer;font-weight:bold;font-size:18px;line-height:1}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .title{font-size:13px;min-height:34px}
  .btn{font-size:11px;padding:7px 0}
  h1{font-size:16px}
  .container{padding:12px}
}
</style>
</head>

let lang = 'zh';

function t(key){
  const v = I18N[lang][key];
  return typeof v === 'function' ? v : (v || '');
}
function brandLabel(b){ return lang === 'zh' ? b : (BRAND_EN[b] || b); }
function craftLabelText(c){ return lang === 'zh' ? c : (CRAFT_EN[c] || c); }
function priceLabelText(p){ return lang === 'zh' ? p : (PRICE_EN[p] || p); }
function commonText(){ return lang === 'zh' ? '通用' : 'Universal'; }

function toast(text, duration=1800){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._h);
  el._h = setTimeout(()=>el.classList.remove('show'), duration);
}

function setLang(l){
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  applyStaticText();
  renderBrandTags();
  render();
}

function applyStaticText(){
  document.getElementById('h1').textContent = t('h1');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('tipText').textContent = t('tip');
  document.getElementById('searchInput').placeholder = t('searchPh');
  document.getElementById('craftLabel').textContent = t('craftLabel');
  document.getElementById('brandLabel').textContent = t('brandLabel');
  document.getElementById('empty').textContent = t('empty');
  document.getElementById('lbDlBtn').textContent = t('lbDl');
  document.getElementById('lbCopyBtn').textContent = t('lbCt');
  document.querySelectorAll('[data-craft="all"], [data-brand="all"]').forEach(el => el.textContent = t('all'));
  document.querySelector('[data-craft="真空凸模"]').textContent = craftLabelText('真空凸模');
  document.querySelector('[data-craft="注塑"]').textContent = craftLabelText('注塑');
}

function renderBrandTags(){
  const wrap = document.getElementById('brandTags');
  const parts = [];
  for (const b of BRAND_ORDER){
    const label = brandLabel(b);
    parts.push('<span class="tag" data-brand="' + b + '" onclick="setBrand(\'' + b + '\', this)">' + label + '</span>');
  }
  wrap.innerHTML = parts.join('');
  document.querySelectorAll('.tagbar [data-brand]').forEach(t => t.classList.remove('active'));
  const sel = state.brand === 'all' ? '[data-brand="all"]' : '#brandTags [data-brand="' + state.brand + '"]';
  document.querySelector(sel).classList.add('active');
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const s = state.search.toLowerCase();
  const list = DATA.filter(r => {
    if (state.craft !== 'all' && r.craft !== state.craft) return false;
    if (state.brand !== 'all' && r.brand !== state.brand) return false;
    if (s && !(r.search_all || '').toLowerCase().includes(s)) return false;
    return true;
  });
  document.getElementById('counts').textContent = t('counts')(list.length, DATA.length);
  if (list.length === 0){ grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map((r, i) => {
    const rel = r.rel_path;
    const title = lang === 'zh' ? r.title_human : r.title_en;
    const craftDisp = lang === 'zh' ? r.craft : r.craft_en;
    const brandDisp = lang === 'zh' ? r.brand : r.brand_en;
    const typeDisp = lang === 'zh' ? r.type : r.type_en;
    const extraDisp = lang === 'zh' ? r.extra : r.extra_en;
    const tEsc = title.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    const ex = extraDisp ? '<span class="pill extra">' + extraDisp + '</span>' : '';
    const priceDisp = priceLabelText(r.price_label || '');
    const pricePill = priceDisp ? '<span class="pill price">' + priceDisp + '</span>' : '';
    const commonPill = r.common ? '<span class="pill common">' + commonText() + '</span>' : '';
    const fitDisp = (lang === 'zh' && r.fit_note) ? r.fit_note : '';
    const fitBox = fitDisp ? '<div class="card-note">通用/适配：' + fitDisp + '</div>' : '';
    return '<div class="card">' +
      '<div class="imgbox" onclick="openLB(\'' + rel + '\',\'' + title.replace(/'/g, "\\'") + '\')">' +
        '<span class="badge craft">' + craftDisp + '</span>' +
        '<span class="badge brand">' + brandDisp + '</span>' +
        '<img loading="lazy" src="images/' + rel + '" alt="' + tEsc + '">' +
      '</div>' +
      '<div class="body">' +
        '<div class="title">' + title + '</div>' +
        '<div class="meta">' +
          '<span class="pill craft">' + craftDisp + '</span>' +
          '<span class="pill type">' + typeDisp + '</span>' + ex + pricePill + commonPill +
        '</div>' + fitBox +
        '<div class="actions">' +
          '<button class="btn" data-act="dl" data-rel="' + rel + '" data-title="' + tEsc + '">' + t('btnDl') + '</button>' +
          '<button class="btn primary" data-act="ct" data-title="' + tEsc + '">' + t('btnCt') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setCraft(c, el){
  state.craft = c;
  document.querySelectorAll('[data-craft]').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}
function setBrand(b, el){
  state.brand = b;
  document.querySelectorAll('[data-brand]').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}
function applyFilter(){
  state.search = document.getElementById('searchInput').value.trim();
  render();
}

document.addEventListener('click', async function(e){
  const btn = e.target.closest('.btn');
  if (btn){
    e.stopPropagation();
    const act = btn.dataset.act;
    if (act === 'dl'){
      downloadImg(btn.dataset.rel, decodeURIComponent(btn.dataset.title));
    } else if (act === 'ct'){
      await copyText(decodeURIComponent(btn.dataset.title), t('toastCopy'));
    }
  }
});

async function copyText(text, msg){
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(msg || '已复制');
}

function downloadImg(rel, title){
  const url = 'images/' + rel;
  const a = document.createElement('a');
  a.href = url;
  a.download = (title || 'image') + '.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast(t('toastDl'));
}

function openLB(rel, title){
  const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = 'images/' + rel;
  document.getElementById('lb-title').textContent = title;
  lbState.title = title;
  document.getElementById('lb-img').dataset.rel = rel;
  lb.classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
function downloadFromLightbox(){
  const rel = document.getElementById('lb-img').dataset.rel;
  if (!rel) return;
  downloadImg(rel, lbState.title);
}
async function copyTitleFromLightbox(){
  await copyText(lbState.title, t('toastCopy'));
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

applyStaticText();
renderBrandTags();
render();

/* ── 版本自愈：微信/浏览器会把整页（含内嵌 DATA）缓存住，导致改完口径扫码还是旧页面。
   做法：页面自己记一个 PAGE_VER，另配一份 version.json，用 no-store 拉一次比对；
   不一致就带 ?v=<新版本> 重载 —— URL 变了，客户端缓存必然失效。
   这样以后扫码永远是当天最新的，不用教客户清缓存。 ── */
(function(){
  var PAGE_VER = '20261022-154201';
  try{
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j || !j.v || j.v === PAGE_VER) return;
        var u = new URL(location.href);
        if (u.searchParams.get('v') === j.v) return;      // 已经是新版，别再转圈
        u.searchParams.set('v', j.v);
        location.replace(u.toString());
      })
      .catch(function(){});
  }catch(e){}
})();
